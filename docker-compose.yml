version: '3.9'

services:
  db:
    image: postgres:16
    container_name: whoismytd_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: whoismytd
      POSTGRES_USER: whoismytd
      POSTGRES_PASSWORD: whoismytd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoismytd"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
